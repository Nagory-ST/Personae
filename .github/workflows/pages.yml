name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture du code, écriture Pages, jeton OIDC pour le
# déploiement. Rien d'autre.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Valeurs PUBLIQUES par conception : elles finissent dans le JavaScript servi
  # au navigateur. La clé publiable n'ouvre que les fonctions `api_*` accordées
  # au rôle `anon` (voir supabase/migrations). Aucun secret ici, et aucun ne
  # doit jamais y être ajouté (clé `service_role` : INTERDITE côté front).
  NEXT_PUBLIC_SUPABASE_URL: https://byakeeekgzbgzjjnifed.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Z6M08sdzqtXBZ1frKuFgUw_9HufaHfR
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Audit des dépendances (bloquant au niveau high)
        run: npm audit --omit=dev --audit-level=high

      - name: Vérification des types
        run: npm run typecheck

      - name: Build statique
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Garde anti-fuite — aucun secret dans le site publié
        run: |
          if grep -rIl -e "service_role" -e "sb_secret_" -e "SUPABASE_SERVICE" out/; then
            echo "Un secret Supabase apparaît dans le build : publication refusée." >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
